name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The skill is installed by copying skills/html-password-gate/ into the harness,
      # so the frontmatter has to satisfy the Agent Skills spec and both scripts have
      # to live inside that directory.
      - name: SKILL.md matches the Agent Skills spec
        run: python3 scripts/check-skills.py

      - name: Scripts parse
        run: |
          for f in skills/html-password-gate/*.mjs; do
            node --check "$f"
          done

      - name: Encrypt round-trip leaves no plaintext behind
        run: |
          printf '<html><body><h1>unique-marker-42</h1></body></html>' > /tmp/in.html
          mkdir -p /tmp/dist
          export GATE_PASSWORD="$(node skills/html-password-gate/gen-password.mjs)"
          node skills/html-password-gate/encrypt.mjs /tmp/in.html /tmp/dist/index.html
          if grep -q unique-marker-42 /tmp/dist/index.html; then
            echo "plaintext leaked into the encrypted output"; exit 1
          fi
          echo "encrypted output is clean"
